<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fffcf7" />
    <meta
      name="description"
      content="Cedar & Salt — a seasonal neighbourhood kitchen in Portland. Wood-fired plates, house-fermented bread and generous glasses of wine. Book a table."
    />
    <title>Cedar &amp; Salt · Seasonal Kitchen in Portland</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      /* Runs before first paint so the page never flashes the wrong theme. */
      ;(function () {
        document.documentElement.classList.add('js-reveal')
        try {
          var stored = localStorage.getItem('cedar-salt-theme')
          var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#17110d' : '#fffcf7')
        } catch (error) {
          /* storage blocked — fall back to the light default */
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
